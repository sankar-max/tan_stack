name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Lint
      run: bun run lint

    - name: Type Check
      run: npx tsc --noEmit

    - name: Build
      run: bun run build
      env:
        SKIP_ENV_VALIDATION: true
        DATABASE_URL: postgresql://temp:temp@localhost:5432/temp
        BETTER_AUTH_SECRET: temp_secret
        GITHUB_CLIENT_ID: temp_id
        GITHUB_CLIENT_SECRET: temp_secret
